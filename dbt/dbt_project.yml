name: insurance_warehouse
version: "1.0.0"
profile: insurance_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Valuation date: earned premium, reserves and triangles are evaluated as of this date.
  as_of_date: "2025-12-31"
  calendar_start: "2023-01-01"
  calendar_end: "2026-12-31"

models:
  insurance_warehouse:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +materialized: table
      core:
        +schema: core
      finance:
        +schema: finance
      claims:
        +schema: claims

seeds:
  insurance_warehouse:
    +schema: reference

snapshots:
  insurance_warehouse:
    +target_schema: snapshots

tests:
  insurance_warehouse:
    +store_failures: true
    +schema: test_failures
